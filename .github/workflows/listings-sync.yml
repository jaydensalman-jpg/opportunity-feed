name: Sync community internship lists

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sync-listings.mjs"
      - ".github/workflows/listings-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: community-listings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source histories and sync changed listing data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node sync-listings.mjs
      - name: Commit updated data
        run: |
          if [[ -n "$(git status --porcelain listings.json listings-archive.json github-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add listings.json listings-archive.json github-state.json
            git commit -m "sync: refresh community internship listings"
            git push
          fi

  publish:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare the public site bundle
        run: |
          mkdir public
          cp index.html listings.json public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
